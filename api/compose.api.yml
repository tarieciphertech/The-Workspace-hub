services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: synexis-workspace-api:0.1.0
    container_name: synexis-workspace-api
    restart: unless-stopped
    environment:
      PORT: "4000"
      DB_HOST: synexis-workspace-db
      DB_PORT: "5432"
      DB_NAME: synexis_workspace
      DB_USER: synexis_app
      DB_PASSWORD: ${SYNEXIS_APP_DB_PASSWORD:?Missing SYNEXIS_APP_DB_PASSWORD in deployment env file}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - synexis-workspace-private
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    init: true

networks:
  synexis-workspace-private:
    external: true
    name: synexis-workspace-private
